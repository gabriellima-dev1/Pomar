body{margin:0}
@keyframes pc-drift{from{transform:translateX(-18px)}to{transform:translateX(18px)}}

@keyframes pc-sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
@keyframes pc-bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes pc-ripen{0%{opacity:.15}100%{opacity:.85}}
.pc-drift{animation:pc-drift 26s ease-in-out infinite alternate}
.pc-drift2{animation:pc-drift2 20s ease-in-out infinite alternate}
.pc-sway{transform-box:fill-box;transform-origin:50% 100%;animation:pc-sway 6s ease-in-out infinite}
.pc-sway-b{transform-box:fill-box;transform-origin:50% 100%;animation:pc-sway 7.5s ease-in-out -2s infinite}

.pc-bob{transform-box:fill-box;transform-origin:50% 100%;animation:pc-bob 3.8s ease-in-out infinite}
.pc-bob-b{transform-box:fill-box;transform-origin:50% 100%;animation:pc-bob 4.6s ease-in-out -1.3s infinite}
.pc-bob-c{transform-box:fill-box;transform-origin:50% 100%;animation:pc-bob 3.3s ease-in-out -2.4s infinite}
.pc-ripen{animation:pc-ripen 12s ease-in-out infinite alternate}
@keyframes pc-fog{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
@keyframes pc-batA{0%{transform:translate(-120px,0)}50%{transform:translate(260px,-40px)}100%{transform:translate(640px,10px)}}
@keyframes pc-batB{0%{transform:translate(520px,0)}50%{transform:translate(200px,30px)}100%{transform:translate(-140px,-12px)}}
@keyframes pc-flapY{0%,100%{transform:scaleY(1)}50%{transform:scaleY(-.6)}}
@keyframes pc-glow{0%,100%{opacity:.55}50%{opacity:1}}
.pc-fog{animation:pc-fog 22s ease-in-out infinite alternate}
.pc-fog2{animation:pc-fog 30s ease-in-out -9s infinite alternate-reverse}
.pc-batA{animation:pc-batA 18s linear infinite}
.pc-batB{animation:pc-batB 24s linear -7s infinite}
.pc-flapY{transform-box:fill-box;transform-origin:50% 50%;animation:pc-flapY .32s ease-in-out infinite}
.pc-glow{animation:pc-glow 2.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.pc-drift,.pc-drift2,.pc-sway,.pc-sway-b,.pc-sway-c,.pc-bob,.pc-bob-b,.pc-bob-c,.pc-ripen,.pc-fog,.pc-fog2,.pc-batA,.pc-batB,.pc-flapY,.pc-glow{animation:none}}
</style>
