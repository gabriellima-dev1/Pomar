<style>

@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
@keyframes bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes float{0%,100%{transform:translate(0,0)}33%{transform:translate(10px,-14px)}66%{transform:translate(-8px,-6px)}}
@keyframes ripen{from{opacity:0}to{opacity:1}}
.drift{animation:drift 24s ease-in-out infinite alternate}
.star{animation:twinkle 3s ease-in-out infinite}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 6s ease-in-out infinite}
.sway-b{transform-box:fill-box;transform-origin:50% 100%;animation:sway 7.5s ease-in-out -3s infinite}
.bob{transform-box:fill-box;transform-origin:50% 100%;animation:bob 4.2s ease-in-out infinite}
.bob-b{transform-box:fill-box;transform-origin:50% 100%;animation:bob 5s ease-in-out -2s infinite}
.ff{animation:float 6s ease-in-out infinite}
.ff circle{animation:twinkle 2.4s ease-in-out infinite}
.ripen{animation:ripen 10s linear infinite}
@media (prefers-reduced-motion: reduce){.drift,.star,.sway,.sway-b,.bob,.bob-b,.ff,.ff circle,.ripen{animation:none}}
</style>
