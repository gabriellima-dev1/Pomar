@keyframes pc-drift{from{transform:translateX(-18px)}to{transform:translateX(18px)}}

@keyframes pc-sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
@keyframes pc-bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}

.pc-drift{animation:pc-drift 26s ease-in-out infinite alternate}
.pc-drift2{animation:pc-drift2 20s ease-in-out infinite alternate}

.pc-bob-b{transform-box:fill-box;transform-origin:50% 100%;animation:pc-bob 4.6s ease-in-out -1.3s infinite}
.pc-bob-c{transform-box:fill-box;transform-origin:50% 100%;animation:pc-bob 3.3s ease-in-out -2.4s infinite}
.pc-ripen{animation:pc-ripen 12s ease-in-out infinite alternate}
@keyframes pc-snow{from{transform:translateY(0)}to{transform:translateY(844px)}}
@keyframes pc-tw{0%,100%{opacity:.55}50%{opacity:1}}
.pc-snow{animation:pc-snow 40s linear infinite}
.pc-snow2{animation:pc-snow 26s linear infinite}
.pc-tw{animation:pc-tw 2.8s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.pc-drift,.pc-drift2,.pc-sway,.pc-sway-b,.pc-sway-c,.pc-bob,.pc-bob-b,.pc-bob-c,.pc-ripen,.pc-snow,.pc-snow2,.pc-tw{animation:none}}
</style>
