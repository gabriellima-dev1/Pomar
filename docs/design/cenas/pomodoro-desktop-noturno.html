body{margin:0}
@keyframes pc-drift{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
@keyframes pc-drift2{from{transform:translateX(14px)}to{transform:translateX(-14px)}}
@keyframes pc-sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
@keyframes pc-bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes pc-ripen{0%{opacity:.15}100%{opacity:.85}}
.pc-drift{animation:pc-drift 26s ease-in-out infinite alternate}
.pc-drift2{animation:pc-drift2 20s ease-in-out infinite alternate}
.pc-sway{transform-box:fill-box;transform-origin:50% 100%;animation:pc-sway 6s ease-in-out infinite}
.pc-sway-b{transform-box:fill-box;transform-origin:50% 100%;animation:pc-sway 7.5s ease-in-out -2s infinite}
.pc-sway-c{transform-box:fill-box;transform-origin:50% 100%;animation:pc-sway 8.5s ease-in-out -4s infinite}
.pc-bob{transform-box:fill-box;transform-origin:50% 100%;animation:pc-bob 3.8s ease-in-out infinite}
.pc-bob-b{transform-box:fill-box;transform-origin:50% 100%;animation:pc-bob 4.6s ease-in-out -1.3s infinite}
.pc-bob-c{transform-box:fill-box;transform-origin:50% 100%;animation:pc-bob 3.3s ease-in-out -2.4s infinite}
.pc-ripen{animation:pc-ripen 12s ease-in-out infinite alternate}
@keyframes pc-tw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes pc-float{0%,100%{transform:translate(0,0)}33%{transform:translate(14px,-18px)}66%{transform:translate(-10px,-8px)}}
@keyframes pc-glow{0%,100%{opacity:.35}50%{opacity:1}}
.pc-tw{animation:pc-tw 4s ease-in-out infinite}
.pc-ff{animation:pc-float 7s ease-in-out infinite}
.pc-ffg{animation:pc-glow 2.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.pc-drift,.pc-drift2,.pc-sway,.pc-sway-b,.pc-sway-c,.pc-bob,.pc-bob-b,.pc-bob-c,.pc-ripen,.pc-tw,.pc-ff,.pc-ffg{animation:none}}
</style>
