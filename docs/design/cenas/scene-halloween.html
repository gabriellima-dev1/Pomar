<style>

@keyframes fog{from{transform:translateX(-24px)}to{transform:translateX(24px)}}
@keyframes flyA{0%{transform:translate(-80px,0)}50%{transform:translate(200px,-30px)}100%{transform:translate(480px,10px)}}
@keyframes flyB{0%{transform:translate(460px,0)}50%{transform:translate(180px,24px)}100%{transform:translate(-90px,-10px)}}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(-.6)}}
@keyframes glow{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes ripen{from{opacity:0}to{opacity:1}}
.fog{animation:fog 12s ease-in-out infinite alternate}
.fog2{animation:fog 16s ease-in-out -6s infinite alternate}
.batA{animation:flyA 15s linear infinite}
.batB{animation:flyB 19s linear -6s infinite}
.wing{transform-box:fill-box;transform-origin:50% 100%;animation:flap .3s ease-in-out infinite}
.glow{animation:glow 2.2s ease-in-out infinite}
.bob{transform-box:fill-box;transform-origin:50% 100%;animation:bob 4.4s ease-in-out infinite}
.bob-b{transform-box:fill-box;transform-origin:50% 100%;animation:bob 5.2s ease-in-out -2s infinite}
.ripen{animation:ripen 10s linear infinite}
@media (prefers-reduced-motion: reduce){.fog,.fog2,.batA,.batB,.wing,.glow,.bob,.bob-b,.ripen{animation:none}}
</style>
