<style>

@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
@keyframes snow{from{transform:translateY(-30px)}to{transform:translateY(700px)}}
@keyframes twinkle{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes ripen{from{opacity:0}to{opacity:1}}
.drift{animation:drift 24s ease-in-out infinite alternate}
.flake{animation:snow linear infinite}
.tw{animation:twinkle 1.8s ease-in-out infinite}
.bob{transform-box:fill-box;transform-origin:50% 100%;animation:bob 4.4s ease-in-out infinite}
.bob-b{transform-box:fill-box;transform-origin:50% 100%;animation:bob 5.2s ease-in-out -2s infinite}
.ripen{animation:ripen 10s linear infinite}
@media (prefers-reduced-motion: reduce){.drift,.flake,.tw,.bob,.bob-b,.ripen{animation:none}}
</style>
