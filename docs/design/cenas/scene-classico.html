<style>

@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
@keyframes drift2{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
@keyframes bob{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.25)}}
@keyframes flyA{0%{transform:translate(0,0)}25%{transform:translate(40px,-20px)}50%{transform:translate(80px,6px)}75%{transform:translate(40px,24px)}100%{transform:translate(0,0)}}
@keyframes flyB{0%{transform:translate(0,0)}33%{transform:translate(-36px,-16px)}66%{transform:translate(-60px,10px)}100%{transform:translate(0,0)}}
@keyframes ripen{from{opacity:0}to{opacity:1}}
.drift{animation:drift 22s ease-in-out infinite alternate}
.drift2{animation:drift2 18s ease-in-out infinite alternate}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
.sway-b{transform-box:fill-box;transform-origin:50% 100%;animation:sway 6.5s ease-in-out -2s infinite}
.sway-c{transform-box:fill-box;transform-origin:50% 100%;animation:sway 7s ease-in-out -4s infinite}
.bob{transform-box:fill-box;transform-origin:50% 100%;animation:bob 3.6s ease-in-out infinite}
.bob-b{transform-box:fill-box;transform-origin:50% 100%;animation:bob 4.4s ease-in-out -1.2s infinite}
.bob-c{transform-box:fill-box;transform-origin:50% 100%;animation:bob 3.2s ease-in-out -2.4s infinite}
.wing{transform-box:fill-box;transform-origin:50% 50%;animation:flap .35s ease-in-out infinite}
.flyA{animation:flyA 14s ease-in-out infinite}
.flyB{animation:flyB 11s ease-in-out infinite}
.ripen{animation:ripen 10s linear infinite}
@media (prefers-reduced-motion: reduce){.drift,.drift2,.sway,.sway-b,.sway-c,.bob,.bob-b,.bob-c,.wing,.flyA,.flyB,.ripen{animation:none}}
</style>
